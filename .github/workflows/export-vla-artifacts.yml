name: Upload VLA Export Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-vla-artifacts.yml'

permissions:
  contents: read

jobs:
  upload-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: export/vla-active-source-df50f942-20260805

      - name: Verify packages exist
        shell: bash
        run: |
          set -euo pipefail
          test -s exports/VLA-Portal-Propietario-Produccion-df50f942.zip
          test -s exports/VLA-Admin-Produccion-df50f942.zip
          sha256sum -c exports/VLA-Portal-Propietario-Produccion-df50f942.sha256
          sha256sum -c exports/VLA-Admin-Produccion-df50f942.sha256

      - name: Upload owner package
        uses: actions/upload-artifact@v4
        with:
          name: VLA-Portal-Propietario-Produccion-df50f942
          path: |
            exports/VLA-Portal-Propietario-Produccion-df50f942.zip
            exports/VLA-Portal-Propietario-Produccion-df50f942.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload admin package
        uses: actions/upload-artifact@v4
        with:
          name: VLA-Admin-Produccion-df50f942
          path: |
            exports/VLA-Admin-Produccion-df50f942.zip
            exports/VLA-Admin-Produccion-df50f942.sha256
          if-no-files-found: error
          retention-days: 7
